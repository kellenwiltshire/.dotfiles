# ===== Auto Workspace Assignment =====
# Mirrors the macOS AeroSpace layout so workspaces hold the same apps on both OSes:
#   1 editor · 2 chat · 3 terminal · 4 mail · 5 music. Browsers are left unassigned.

# Editor → Workspace 1
windowrule {
  name = windowrule-1
  workspace = 1
  match:class = ^(code|Cursor|cursor)$
}

# Chats → Workspace 2
windowrule {
  name = windowrule-2
  workspace = 2
  match:class = ^(chrome-discord.com__channels_@me-Default|chrome-web.whatsapp.com__-Default|chrome-messages.google.com__web_conversations-Default)$
}

# Terminal → Workspace 3
windowrule {
  name = windowrule-3
  workspace = 3
  match:class = ^(com.mitchellh.ghostty)$
}

# Mail → Workspace 4
windowrule {
  name = windowrule-4
  workspace = 4
  match:class = ^(Proton Mail|proton-mail)$
}

# Music → Workspace 5
windowrule {
  name = windowrule-5
  workspace = 5
  match:class = ^(Spotify|spotify)$
}
