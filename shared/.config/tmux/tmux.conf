# Based on Omarchy's shipped tmux.conf, with ThePrimeagen's prefix, pane keys and
# sessionizer layered on top. Diff against $OMARCHY_PATH/config/tmux/tmux.conf to
# see what has drifted after an Omarchy update.

# Prefix. C-a costs you readline start-of-line; C-a a sends a literal C-a through.
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Reload config
bind q source-file ~/.config/tmux/tmux.conf \; display "Configuration reloaded"

# Vi mode for copy
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# Sessionizer. Opens in a throwaway window so fzf never disturbs the current pane.
bind -r f run-shell "tmux neww ~/.local/bin/tmux-sessionizer"
bind -r ^ last-window

# Pane navigation. Repeatable, so the prefix can be held for a burst of moves.
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R

# The same four keys without the prefix, crossing into Neovim's splits as if they were panes.
# smart-splits.nvim marks its own pane with @pane-is-vim, so this is a format test rather than the
# usual trick of shelling out to `ps` on every keystroke to guess what is running.
bind -n C-h if -F '#{@pane-is-vim}' 'send-keys C-h' 'select-pane -L'
bind -n C-j if -F '#{@pane-is-vim}' 'send-keys C-j' 'select-pane -D'
bind -n C-k if -F '#{@pane-is-vim}' 'send-keys C-k' 'select-pane -U'
bind -n C-l if -F '#{@pane-is-vim}' 'send-keys C-l' 'select-pane -R'

# The price of the four above: readline loses backward-delete, accept-line, kill-line and
# clear-screen in any pane that is not Neovim. The prefix hands each of them back.
bind C-h send-keys C-h
bind C-j send-keys C-j
bind C-k send-keys C-k
bind C-l send-keys C-l

# Copy mode has no Neovim to hand off to, so the same keys just move.
bind -T copy-mode-vi C-h select-pane -L
bind -T copy-mode-vi C-j select-pane -D
bind -T copy-mode-vi C-k select-pane -U
bind -T copy-mode-vi C-l select-pane -R

# Splits. Moved off h/v to free those for pane navigation above.
bind '|' split-window -h -c "#{pane_current_path}"
bind '-' split-window -v -c "#{pane_current_path}"

bind -n M-Enter split-window -v -c "#{pane_current_path}"
bind -n M-S-Enter split-window -h -c "#{pane_current_path}"
bind -n M-Escape kill-pane

bind -n C-M-Left select-pane -L
bind -n C-M-Right select-pane -R
bind -n C-M-Up select-pane -U
bind -n C-M-Down select-pane -D

bind -n C-M-S-Left resize-pane -L 5
bind -n C-M-S-Down resize-pane -D 5
bind -n C-M-S-Up resize-pane -U 5
bind -n C-M-S-Right resize-pane -R 5

# Kill. x pane, X window, K session; k is pane navigation now.
bind x kill-pane
bind X kill-window
bind K kill-session

# Window navigation
bind r command-prompt -I "#W" "rename-window -- '%%'"
bind c new-window -c "#{pane_current_path}"

bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

bind -n M-Left select-window -t -1
bind -n M-Right select-window -t +1
bind -n M-S-Left swap-window -t -1 \; select-window -t -1
bind -n M-S-Right swap-window -t +1 \; select-window -t +1

# Session controls
bind R command-prompt -I "#S" "rename-session -- '%%'"
bind C new-session -c "#{pane_current_path}"
bind P switch-client -p
bind N switch-client -n

bind -n M-Up switch-client -p
bind -n M-Down switch-client -n

# Alt-tab between the two sessions you actually use; `prefix L` does the same with a prefix.
# M-Tab is unavailable: Omarchy binds every ALT+TAB combination compositor-side, so Hyprland
# swallows the key before Ghostty sees it.
bind -n M-o switch-client -l

# Scratch pad. Root table and one shared "scratch" session, so every client toggles the same
# nvim on ~/notes/scratch.md with its cursor, undo and unsaved text intact. Two -E means the
# popup only auto-closes on success, so a broken scratchpad shows its error instead of flashing.
bind -n M-g if -F '#{==:#{session_name},scratch}' {
  detach-client
} {
  display-popup -xC -yC -w 80% -h 80% -b rounded -S "fg=#82aaff" -T " notes " -EE '~/.local/bin/tmux-scratchpad'
}

# lazygit on the current pane's directory. Nothing to preserve between invocations, unlike the
# scratchpad, so a single -E is right: the popup closes when lazygit exits, however it exits.
bind g display-popup -xC -yC -w 90% -h 90% -b rounded -S "fg=#82aaff" -T " lazygit " -d "#{pane_current_path}" -E lazygit

# General
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",*:RGB"
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -g focus-events on
set -g set-clipboard on
set -g allow-passthrough on
setw -g aggressive-resize on
# Keeps a killed session from ejecting you out of tmux entirely.
set -g detach-on-destroy off
set -g extended-keys on
set -g extended-keys-format csi-u
set -ag terminal-features "xterm-kitty:extkeys,xterm-ghostty:extkeys"
set -s escape-time 0

# Window names track the pane's directory, with the running command appended unless it is a bare
# shell. `bind r` still pins a manual name; `setw automatic-rename on` hands the window back.
set -g automatic-rename on

# Status bar. Night Owl palette, matched to the Ghostty theme. The current window and the clock are
# rounded with the Nerd Font half circles U+E0B6/U+E0B4, which is the whole tell for which tab is
# live; the others stay square. Ghostty bundles the symbols, other terminals may need a patched
# font. Those are Private Use Area codepoints, and some editors and agents strip them silently on
# write — this file lost them once already and rendered plain blocks until they were put back as
# raw bytes. The giveaway is a format opening with a `#[fg=...]` that paints nothing.
# tmux-status emits its own pair from printf, where nothing can rewrite them.
set -g status-position bottom
# The network rate is averaged over this gap, so two seconds keeps it reactive. Refreshing that
# often only reads calmly because tmux-status pads every field to a fixed width; without that the
# numbers change size constantly and the whole block twitches. Each tick costs one ~120ms run.
set -g status-interval 2
set -g status-justify left
set -g status-style "bg=#011627,fg=#637777"

set -g status-left-length 40
# The session badge doubles as a mode indicator: orange PREFIX once the prefix is armed, purple
# COPY inside copy mode, otherwise the session name. Both states swallow ordinary keystrokes, so
# the badge answers "why did my typing do nothing" without a second glance.
set -g status-left "#[bg=#{?client_prefix,#f78c6c,#{?pane_in_mode,#c792ea,#7fdbca}},fg=#011627,bold] #{?client_prefix,PREFIX,#{?pane_in_mode,COPY,#S}} #[bg=default,fg=default] "

# CPU, load, memory, disk, network and battery, then the host and a clock badge. One script owns
# the whole right side so it costs a single fork per interval, and so the separator glyphs can be
# emitted as raw bytes — see the comment above. It is passed the width because it sheds segments
# on a narrow client, and #h because tmux already knows the short hostname.
set -g status-right-length 120
set -g status-right "#(~/.local/bin/tmux-status #{client_width} #h)"

set -g window-status-separator " "
set -g window-status-format "#[bg=#1d3b53,fg=#8badc1] #I #W#{?window_zoomed_flag, +,} #[bg=default,fg=default]"
set -g window-status-current-format "#[fg=#82aaff]#[bg=#82aaff,fg=#011627,bold] #I #W#{?window_zoomed_flag, +,} #[bg=default,fg=#82aaff]"
set -g window-status-activity-style "none"
set -g window-status-bell-style "bg=#ef5350,fg=#011627,bold"

# The active pane gets the same blue as the active window, so both levels read at a glance.
set -g pane-border-style "fg=#1d3b53"
set -g pane-active-border-style "fg=#82aaff"
set -g message-style "bg=#82aaff,fg=#011627,bold"
set -g mode-style "bg=#1d3b53,fg=#d6deeb"
